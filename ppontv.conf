# ppontv - PhotoPrism On TV
# Configuration file

# PhotoPrism connection
PHOTOPRISM_URL=http://your-photoprism-host:2342
PHOTOPRISM_USER=your-username
PHOTOPRISM_PASSWORD=your-password

# Slideshow settings
SLIDESHOW_INTERVAL=5        # seconds between photos
SLIDESHOW_RANDOM=false      # randomize photo order within album
SHOW_INFO_OVERLAY=true      # show date/location info on photos
SHOW_CLOCK=true             # show clock on album selection screen

# App settings
PORT=3000
